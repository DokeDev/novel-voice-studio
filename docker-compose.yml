services:
  alexandria:
    build: .
    ports:
      - "4200:4200"
    environment:
      # Store WebUI settings on a mounted volume so they survive container restarts
      - ALEXANDRIA_CONFIG_PATH=/alexandria/config/config.json
      - ALEXANDRIA_MODELS_DIR=/alexandria/models
      - ALEXANDRIA_OUTPUT_DIR=/alexandria/final
      - ALEXANDRIA_ENABLE_BUILTIN_LORA=false
      - HF_HOME=/alexandria/cache/huggingface
      - ALEXANDRIA_S3_ENDPOINT=${ALEXANDRIA_S3_ENDPOINT:-}
      - ALEXANDRIA_S3_REGION=${ALEXANDRIA_S3_REGION:-}
      - ALEXANDRIA_S3_BUCKET=${ALEXANDRIA_S3_BUCKET:-}
      - ALEXANDRIA_S3_ACCESS_KEY_ID=${ALEXANDRIA_S3_ACCESS_KEY_ID:-}
      - ALEXANDRIA_S3_SECRET_ACCESS_KEY=${ALEXANDRIA_S3_SECRET_ACCESS_KEY:-}
      - ALEXANDRIA_S3_PUBLIC_BASE_URL=${ALEXANDRIA_S3_PUBLIC_BASE_URL:-}
      - ALEXANDRIA_S3_PREFIX=${ALEXANDRIA_S3_PREFIX:-audiobooks}
    volumes:
      # Models stay outside the image and can be populated on the GPU host.
      - ./data/models:/alexandria/models
      - ./data/cache:/alexandria/cache
      # Persist user data
      - ./data/uploads:/alexandria/app/uploads
      - ./data/designed_voices:/alexandria/designed_voices
      - ./data/clone_voices:/alexandria/clone_voices
      - ./data/lora_models:/alexandria/lora_models
      - ./data/lora_datasets:/alexandria/lora_datasets
      - ./data/dataset_builder:/alexandria/dataset_builder
      - ./data/scripts:/alexandria/scripts
      # Persist WebUI settings (OpenAI endpoint, prompts, TTS mode, etc.)
      - ./data/config:/alexandria/config
      # Persist audiobook output
      - ./data/output:/alexandria/voicelines
      - ./data/final:/alexandria/final
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
